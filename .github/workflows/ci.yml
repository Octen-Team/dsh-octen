name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # Skips itself when the OCTEN_API_KEY secret is absent (e.g. pull requests from forks).
      - name: Live Octen API
        env:
          OCTEN_API_KEY: ${{ secrets.OCTEN_API_KEY }}
        run: pnpm run test:live
